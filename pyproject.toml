[tool.pylint.main]
ignore-paths = [
    "__pycache__/",
    "venv/",
    "recipes/venv/",
]
jobs = 0
py-version = "3.12"
recursive = true
load-plugins = [
    "pylint_django"
]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "import-error",
    "line-too-long",
    "no-member",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-statements",
    "too-many-return-statements",
]

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.black]
line-length = 100
target-version = ["py312"]
